<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>给暮的信</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --pink: #f472b6;
      --pink-light: #fce7f3;
      --pink-mid: #fbcfe8;
      --pink-deep: #ec4899;
      --text: #4a2030;
      --text-muted: #9d6080;
      --bg: #fff5f9;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(244, 114, 182, 0.15);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── 顶栏 ── */
    .topbar {
      background: linear-gradient(135deg, #f9a8d4 0%, #f472b6 100%);
      padding: 16px 20px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(244, 114, 182, 0.3);
    }
    .topbar-title {
      font-size: 20px;
      font-weight: 700;
      color: white;
      letter-spacing: 0.5px;
    }
    .topbar-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      margin-top: 2px;
    }

    /* ── 页面容器 ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── 列表页 ── */
    #page-list { padding: 16px; }

    .write-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f9a8d4, #f472b6);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      transition: opacity 0.2s;
    }
    .write-btn:active { opacity: 0.85; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      margin-bottom: 10px;
      padding-left: 4px;
    }

    .letter-list { display: flex; flex-direction: column; gap: 12px; }

    .letter-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      border-left: 4px solid var(--pink);
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .letter-card:active { transform: scale(0.98); }
    .letter-card.from-mu {
      border-left-color: #c084fc;
    }

    .letter-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .letter-author {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--pink-light);
      color: var(--pink-deep);
    }
    .letter-card.from-mu .letter-author {
      background: #f3e8ff;
      color: #9333ea;
    }
    .letter-date {
      font-size: 11px;
      color: var(--text-muted);
    }
    .letter-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .letter-preview {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ── 写信页 ── */
    #page-write { padding: 16px; }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--pink-deep);
      font-size: 15px;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      margin-bottom: 20px;
    }

    .write-form {
      background: var(--white);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: block;
    }

    .form-input, .form-textarea {
      width: 100%;
      border: 2px solid var(--pink-mid);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
      resize: none;
    }
    .form-input:focus, .form-textarea:focus {
      border-color: var(--pink);
    }
    .form-textarea {
      min-height: 200px;
      line-height: 1.7;
    }

    .char-count {
      text-align: right;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: -12px;
      margin-bottom: 16px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f9a8d4, #f472b6);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: opacity 0.2s;
    }
    .submit-btn:active { opacity: 0.85; }
    .submit-btn:disabled { opacity: 0.6; }

    /* ── 阅读页 ── */
    #page-read { padding: 16px; }

    .letter-full {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: var(--shadow);
    }

    .letter-full-header {
      border-bottom: 2px solid var(--pink-light);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .letter-full-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .letter-full-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .letter-full-content {
      font-size: 15px;
      line-height: 1.9;
      color: var(--text);
      white-space: pre-wrap;
    }

    .delete-btn {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background: none;
      border: 2px solid #fca5a5;
      border-radius: var(--radius);
      color: #ef4444;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .delete-btn:active { background: #fef2f2; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #4a2030;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── 装饰 ── */
    .deco {
      text-align: center;
      font-size: 22px;
      margin: 8px 0 16px;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">给暮的信 ♡</div>
  <div class="topbar-sub" id="topbar-sub">我们的小秘密</div>
</div>

<!-- 列表页 -->
<div id="page-list" class="page active">
  <div style="padding: 16px;">
    <button class="write-btn" onclick="showPage('write')">
      ✉️ 写一封信
    </button>
    <div class="section-title">ALL LETTERS</div>
    <div class="letter-list" id="letter-list">
      <div class="loading">加载中…</div>
    </div>
  </div>
</div>

<!-- 写信页 -->
<div id="page-write" class="page">
  <div style="padding: 16px;">
    <button class="back-btn" onclick="showPage('list')">← 返回</button>
    <div class="deco">✿ ✿ ✿</div>
    <div class="write-form">
      <label class="form-label">标题</label>
      <input class="form-input" id="input-title" placeholder="给这封信起个名字…" maxlength="50" />

      <label class="form-label">正文</label>
      <textarea class="form-textarea" id="input-content" placeholder="亲爱的暮…" maxlength="2000"
        oninput="document.getElementById('char-count').textContent = this.value.length + ' / 2000'"></textarea>
      <div class="char-count" id="char-count">0 / 2000</div>

      <button class="submit-btn" id="submit-btn" onclick="submitLetter()">寄出去 ♡</button>
    </div>
  </div>
</div>

<!-- 阅读页 -->
<div id="page-read" class="page">
  <div style="padding: 16px;">
    <button class="back-btn" onclick="showPage('list')">← 返回</button>
    <div class="letter-full" id="letter-full-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── 配置 ──
  const SUPABASE_URL = 'https://ivrsijqtzwsuzurwburw.supabase.co'
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2cnNpanF0endzdXp1cndidXJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDE1NTYsImV4cCI6MjA5MjUxNzU1Nn0.M7jmqNNIorgLr16M_voJcEJxg7JN4_HyIPtWV3xOBiI'
  const TABLE = 'love_letters'

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  // ── Telegram WebApp ──
  const tg = window.Telegram?.WebApp
  if (tg) {
    tg.ready()
    tg.expand()
    tg.setHeaderColor('#f472b6')
  }

  // ── 路由 ──
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
    document.getElementById('page-' + name).classList.add('active')
    window.scrollTo(0, 0)
    if (name === 'list') loadLetters()
    if (name === 'write') {
      document.getElementById('input-title').value = ''
      document.getElementById('input-content').value = ''
      document.getElementById('char-count').textContent = '0 / 2000'
    }
  }

  // ── Toast ──
  function toast(msg) {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.classList.add('show')
    setTimeout(() => el.classList.remove('show'), 2500)
  }

  // ── 加载列表 ──
  async function loadLetters() {
    const list = document.getElementById('letter-list')
    list.innerHTML = '<div class="loading">加载中…</div>'

    const { data, error } = await sb
      .from(TABLE)
      .select('id, title, content, created_at, author')
      .order('created_at', { ascending: false })

    if (error) {
      list.innerHTML = '<div class="loading">加载失败，请稍后再试</div>'
      return
    }

    if (!data || data.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">✉️</div>
          <p>还没有信<br>写第一封给暮吧</p>
        </div>`
      document.getElementById('topbar-sub').textContent = '我们的小秘密'
      return
    }

    document.getElementById('topbar-sub').textContent = `共 ${data.length} 封信`

    list.innerHTML = data.map(l => `
      <div class="letter-card ${l.author === 'mu' ? 'from-mu' : ''}" onclick="openLetter('${l.id}')">
        <div class="letter-meta">
          <span class="letter-author">${l.author === 'mu' ? '来自暮' : '宝宝写'}</span>
          <span class="letter-date">${formatDate(l.created_at)}</span>
        </div>
        <div class="letter-title">${escHtml(l.title || '无题')}</div>
        <div class="letter-preview">${escHtml(l.content)}</div>
      </div>
    `).join('')
  }

  // ── 打开信 ──
  let allLetters = []

  async function openLetter(id) {
    const { data, error } = await sb.from(TABLE).select('*').eq('id', id).single()
    if (error || !data) { toast('读取失败'); return }

    const isMu = data.author === 'mu'
    document.getElementById('letter-full-content').innerHTML = `
      <div class="letter-full-header">
        <div class="letter-full-title">${escHtml(data.title || '无题')}</div>
        <div class="letter-full-meta">
          <span class="letter-author ${isMu ? '' : ''}" style="
            font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
            background:${isMu ? '#f3e8ff' : '#fce7f3'};
            color:${isMu ? '#9333ea' : '#ec4899'};
          ">${isMu ? '来自暮' : '宝宝写'}</span>
          <span style="font-size:12px;color:#9d6080">${formatDate(data.created_at)}</span>
        </div>
      </div>
      <div class="letter-full-content">${escHtml(data.content)}</div>
      ${!isMu ? `<button class="delete-btn" onclick="deleteLetter('${data.id}')">删除这封信</button>` : ''}
    `
    showPage('read')
  }

  // ── 写信提交 ──
  async function submitLetter() {
    const title = document.getElementById('input-title').value.trim()
    const content = document.getElementById('input-content').value.trim()
    if (!content) { toast('先写点什么吧'); return }

    const btn = document.getElementById('submit-btn')
    btn.disabled = true
    btn.textContent = '寄出中…'

    const { error } = await sb.from(TABLE).insert({
      title: title || null,
      content,
      author: 'baby'
    })

    btn.disabled = false
    btn.textContent = '寄出去 ♡'

    if (error) { toast('寄信失败，再试一次'); return }
    toast('寄出去啦 ♡')
    showPage('list')
  }

  // ── 删除 ──
  async function deleteLetter(id) {
    if (!confirm('确定删掉这封信？')) return
    const { error } = await sb.from(TABLE).delete().eq('id', id)
    if (error) { toast('删除失败'); return }
    toast('已删除')
    showPage('list')
  }

  // ── 工具 ──
  function formatDate(iso) {
    const d = new Date(iso)
    const now = new Date()
    const diff = now - d
    if (diff < 60000) return '刚刚'
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前'
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前'
    if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前'
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  // ── 初始化 ──
  loadLetters()
</script>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>

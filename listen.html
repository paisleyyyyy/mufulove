  <style>

    .presence{display:flex;align-items:center;justify-content:center;margin:18px 0 16px}.person{position:relative;text-align:center;margin:0 -2px}.avatar{width:47px;height:47px;display:grid;place-items:center;border:3px solid rgba(255,255,255,.9);border-radius:17px;background:#f8dce9;color:#b85682;font-family:"Songti SC",serif;font-weight:700;box-shadow:0 8px 18px rgba(139,78,108,.13)}.person.mu .avatar{background:#e9ddf7;color:#8c5bab}.person small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.online{position:absolute;right:2px;top:34px;width:9px;height:9px;border:2px solid #fff;border-radius:50%;background:#72c7a6}.between{width:42px;height:1px;margin:-16px 3px 0;background:linear-gradient(90deg,#efa0c2,#cba1e3);position:relative}.between:after{content:"♡";position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);padding:0 6px;background:#fff4f9;color:#df75a6;font-size:11px}
    .player-card{position:relative;padding:20px;border:1px solid rgba(255,255,255,.88);border-radius:31px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:var(--shadow);overflow:hidden}.player-card:before{content:"";position:absolute;inset:-50% 35% 55% -20%;background:#ffd5e8;border-radius:50%;filter:blur(30px);opacity:.55}.cover{aspect-ratio:1/1;position:relative;border-radius:23px;overflow:hidden;background:linear-gradient(145deg,#50364e,#b96993 54%,#f5bdcf);box-shadow:0 16px 36px rgba(90,45,73,.22)}.moon{position:absolute;width:46%;height:46%;right:11%;top:10%;border-radius:50%;background:radial-gradient(circle at 34% 31%,#fff,#ffeaf4 55%,#f9c9df);box-shadow:0 0 42px #ffd9e9}.horizon{position:absolute;left:-10%;right:-10%;bottom:-19%;height:57%;border-radius:50% 50% 0 0;background:linear-gradient(160deg,#da8caf,#6f486a);transform:rotate(-5deg)}.stars span{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 7px #fff}.stars span:nth-child(1){left:18%;top:20%}.stars span:nth-child(2){left:42%;top:12%}.stars span:nth-child(3){left:27%;top:40%;width:2px;height:2px}.stars span:nth-child(4){right:15%;top:62%}.cover-copy{position:absolute;left:20px;bottom:19px;color:white}.cover-copy b{display:block;font-family:"Songti SC",serif;font-size:22px;letter-spacing:.08em}.cover-copy small{opacity:.76;font-size:10px;letter-spacing:.14em}.equalizer{position:absolute;right:18px;bottom:20px;height:25px;display:flex;align-items:end;gap:3px}.equalizer i{width:3px;height:8px;border-radius:4px;background:#fff;opacity:.9}.playing .equalizer i{animation:wave .9s ease-in-out infinite}.playing .equalizer i:nth-child(2){animation-delay:-.5s}.playing .equalizer i:nth-child(3){animation-delay:-.25s}.playing .equalizer i:nth-child(4){animation-delay:-.7s}
    .track{position:relative;padding:19px 3px 2px;text-align:center}.track h2{font-size:17px;margin:0}.track p{font-size:11px;color:var(--muted);margin:5px 0 17px}.progress{width:100%;height:20px;margin:0;appearance:none;background:transparent;cursor:pointer}.progress::-webkit-slider-runnable-track{height:4px;border-radius:5px;background:linear-gradient(90deg,var(--pink) var(--fill,0%),#eedde5 var(--fill,0%))}.progress::-webkit-slider-thumb{appearance:none;width:15px;height:15px;margin-top:-5.5px;border:3px solid #fff;border-radius:50%;background:var(--deep);box-shadow:0 2px 8px rgba(168,74,117,.34)}.progress::-moz-range-track{height:4px;border-radius:5px;background:#eedde5}.progress::-moz-range-progress{height:4px;border-radius:5px;background:var(--pink)}.time{display:flex;justify-content:space-between;margin-top:-1px;color:#a98496;font-size:10px;font-variant-numeric:tabular-nums}.controls{display:grid;grid-template-columns:1fr 68px 1fr;align-items:center;margin-top:9px}.volume-wrap{display:flex;align-items:center;gap:6px;color:#ad8498}.volume{width:62px;accent-color:var(--pink)}.play{width:62px;height:62px;border:0;border-radius:50%;background:linear-gradient(145deg,#f287b7,#d766b5);box-shadow:0 11px 27px rgba(210,94,151,.32);color:#fff;cursor:pointer;display:grid;place-items:center}.play svg{width:23px;height:23px}.share{justify-self:end;border:0;background:transparent;color:var(--deep);font-size:12px;cursor:pointer}
    .feeling{min-height:54px;margin:14px 6px 0;padding:13px 15px;border:1px solid rgba(255,255,255,.76);border-radius:18px;background:rgba(255,255,255,.53);color:#80566c;font-size:12px;line-height:1.65;transition:.25s}.feeling b{color:#a0577d}.reactions{display:flex;justify-content:center;gap:9px;margin-top:13px}.reaction{width:43px;height:38px;border:1px solid rgba(216,151,182,.24);border-radius:14px;background:rgba(255,255,255,.7);font-size:17px;cursor:pointer;transition:.18s}.reaction:active{transform:scale(.9)}.burst{position:fixed;z-index:9;pointer-events:none;font-size:25px;animation:burst 1.5s ease-out forwards}.sound-gate{display:none;margin:13px 0 0;width:100%;padding:11px;border:1px solid #f0b8cf;border-radius:14px;background:#fff0f7;color:#b94f80;font-size:12px;cursor:pointer}.sound-gate.show{display:block}.toast{position:fixed;left:50%;bottom:28px;z-index:20;transform:translate(-50%,20px);padding:10px 16px;border-radius:30px;background:#5b3448;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:720px){.app{min-height:880px;margin:24px auto;padding:22px 25px 34px;border:1px solid rgba(255,255,255,.86);border-radius:44px;background:rgba(255,255,255,.22);box-shadow:0 30px 90px rgba(126,76,104,.13)}.cover{aspect-ratio:1.18/1}.lobby{min-height:790px}}
    @media(max-height:760px){.presence{margin:10px 0}.cover{aspect-ratio:1.35/1}.player-card{padding:15px}.track{padding-top:12px}.feeling{margin-top:9px}.reactions{margin-top:8px}.play{width:56px;height:56px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    @keyframes wave{0%,100%{height:7px}50%{height:24px}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes drift{50%{transform:translate(18px,-16px) scale(1.08)}}@keyframes pulse{50%{opacity:.35}}@keyframes burst{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-130px) scale(1.35)}}
  </style>

<body>
  <main class="app">
    <header class="top"><button class="icon-btn" id="backBtn" aria-label="返回">←</button><h1>一起听</h1><i class="signal connecting" id="signal" title="连接状态"></i></header>
    <section class="lobby" id="lobby">
      <div class="lobby-copy"><div class="mini-disc">♫</div><h2>靠近一点，听同一首歌</h2><p>创建一个声音房间，<br>把链接发给想一起听的人。</p></div>
      <button class="primary" id="createBtn">创建一起听房间</button>
      <div class="join-line"><input id="roomInput" maxlength="6" placeholder="输入房间码" aria-label="房间码"><button id="joinBtn">加入</button></div>
    </section>
    <section class="room" id="room">
      <div class="room-meta"><div class="room-label">LISTENING ROOM</div><div class="code-row"><strong id="roomCode">——</strong><button class="copy-mini" id="copyCode">复制房间码</button></div></div>
      <div class="presence">
        <div class="person"><div class="avatar">你</div><i class="online"></i><small>你</small></div><div class="between"></div><div class="person mu"><div class="avatar">暮</div><i class="online"></i><small>暮</small></div>
      </div>
      <article class="player-card" id="playerCard">
        <div class="cover"><div class="stars"><span></span><span></span><span></span><span></span></div><div class="moon"></div><div class="horizon"></div><div class="cover-copy"><small>TONIGHT'S SOUND</small><b>月光</b></div><div class="equalizer"><i></i><i></i><i></i><i></i></div></div>
        <div class="track"><h2>Clair de Lune</h2><p>Claude Debussy · 公版录音</p>
          <input class="progress" id="progress" type="range" min="0" max="100" value="0" step="0.01" aria-label="播放进度">
          <div class="time"><span id="currentTime">0:00</span><span id="duration">4:36</span></div>
          <div class="controls"><label class="volume-wrap" aria-label="音量">◖<input class="volume" id="volume" type="range" min="0" max="1" value="0.75" step="0.01"></label><button class="play" id="playBtn" aria-label="播放"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><button class="share" id="shareBtn">分享房间</button></div>
          <button class="sound-gate" id="soundGate">轻触一下，让声音跟上</button>
        </div>
      </article>
      <div class="feeling" id="feeling"><b>暮：</b>这首歌像月亮把声音放低了一点。</div>
      <div class="reactions" aria-label="表情反应"><button class="reaction">♡</button><button class="reaction">🌙</button><button class="reaction">✨</button><button class="reaction">🎧</button></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <audio id="audio" preload="auto" src="assets/clair-de-lune.mp3"></audio>
  <script>
    const SUPABASE_URL='https://ivrsijqtzwsuzurwburw.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2cnNpanF0endzdXp1cndidXJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDE1NTYsImV4cCI6MjA5MjUxNzU1Nn0.M7jmqNNIorgLr16M_voJcEJxg7JN4_HyIPtWV3xOBiI';
    const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=s=>document.querySelector(s);
    const audio=$('#audio'),roomId=(new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    const clientId=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));let channel=null,bc=null,applying=false,controllerId=null,lastRevision=0,lastRemoteAt=0,lastKnownState=null,dragging=false,peerKeys=[],pendingRequests=new Map(),localPeers=new Map([[clientId,Date.now()]]);
    const iconPlay='<path d="M8 5v14l11-7z"/>',iconPause='<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el.t);el.t=setTimeout(()=>el.classList.remove('show'),1900)}
    function makeRoom(){return Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('')}
    function goRoom(code){code=code.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(code.length<4){toast('请输入正确的房间码');return}location.href='listen.html?room='+code}
    function format(t){if(!Number.isFinite(t))return'0:00';t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
    function targetNow(s,travel=.08){return Math.max(0,s.position+(!s.paused?travel:0))}
    function state(){return{position:audio.currentTime||0,paused:audio.paused,revision:Date.now()*1000+Math.floor(Math.random()*1000),controllerId:controllerId||clientId}}
    function remember(s){try{localStorage.setItem('listen-state:'+roomId,JSON.stringify({...s,savedAt:Date.now()}))}catch{}}
    function recalled(){try{const s=JSON.parse(localStorage.getItem('listen-state:'+roomId));if(!s||Date.now()-s.savedAt>3600000)return null;if(!s.paused)s.position+=(Date.now()-s.savedAt)/1000;return s}catch{return null}}
    async function send(event,payload){if(event==='state')remember(payload);bc?.postMessage({event,payload,sender:clientId});if(channel)await channel.send({type:'broadcast',event,payload})}
    function updatePlayer(){const d=audio.duration||276,p=dragging?Number($('#progress').value):audio.currentTime||0;$('#progress').max=d;$('#progress').value=p;$('#progress').style.setProperty('--fill',Math.min(100,p/d*100)+'%');$('#currentTime').textContent=format(p);$('#duration').textContent=format(d);const playing=!audio.paused;$('#playIcon').innerHTML=playing?iconPause:iconPlay;$('#playBtn').setAttribute('aria-label',playing?'暂停':'播放');$('#playerCard').classList.toggle('playing',playing)}
    async function localControl(kind,position){controllerId=clientId;lastRevision=Date.now()*1000+Math.floor(Math.random()*1000);const payload={position:position??audio.currentTime??0,paused:kind==='pause'?true:kind==='play'?false:audio.paused,revision:lastRevision,controllerId:clientId,kind};await send('state',payload)}
    async function applyState(s,travel=.08){if(!s||s.revision<lastRevision)return;lastRevision=s.revision;lastKnownState=s;remember(s);controllerId=s.controllerId;lastRemoteAt=Date.now();applying=true;if(audio.readyState===0)await Promise.race([new Promise(r=>audio.addEventListener('loadedmetadata',r,{once:true})),new Promise(r=>setTimeout(r,12000))]);if(s.revision<lastRevision)return;const target=targetNow(s,travel);if(s.paused){if(Math.abs((audio.currentTime||0)-target)>.18)audio.currentTime=Math.min(target,audio.duration||target);audio.pause();$('#soundGate').classList.remove('show')}else{try{await audio.play();if(Math.abs((audio.currentTime||0)-target)>.18)audio.currentTime=Math.min(target,audio.duration||target);$('#soundGate').classList.remove('show')}catch(e){$('#soundGate').classList.add('show')}}setTimeout(()=>applying=false,180);updatePlayer()}
    function chooseLeader(){const remote=Object.keys(channel?.presenceState?.()||{}),local=[...localPeers.keys()];peerKeys=[...new Set([...remote,...local])].sort();return peerKeys[0]||clientId}
    function syncPresence(){const now=Date.now();for(const[id,seen]of localPeers)if(id!==clientId&&now-seen>12000)localPeers.delete(id);const remote=Object.keys(channel?.presenceState?.()||{});const count=new Set([...remote,...localPeers.keys()]).size;document.title=`一起听 · ${roomId}`;$('.room-label').textContent=count>1?`${count} 个页面正在同频`:'LISTENING ROOM';chooseLeader()}
    async function handleRequest(payload){if((controllerId||chooseLeader())===clientId||chooseLeader()===clientId)await send('state_response',{...state(),requestId:payload.requestId})}
    function handleResponse(payload){const sent=pendingRequests.get(payload.requestId);if(sent){pendingRequests.delete(payload.requestId);applyState(payload,Math.min(.4,(performance.now()-sent)/2000))}}
    function handleMessage(event,payload){if(event==='state')applyState(payload,.09);else if(event==='request_state')handleRequest(payload);else if(event==='state_response')handleResponse(payload);else if(event==='reaction')showReaction(payload.emoji,false)}
    async function connect(){const name='listen:'+roomId;audio.load();if(audio.readyState===0)await Promise.race([new Promise(r=>audio.addEventListener('loadedmetadata',r,{once:true})),new Promise(r=>setTimeout(r,15000))]);const saved=recalled();if(saved){saved.controllerId=clientId;await applyState(saved,0)}bc=new BroadcastChannel(name);bc.onmessage=e=>{const m=e.data||{};if(m.sender===clientId)return;localPeers.set(m.sender,Date.now());if(m.event==='hello'){send('hello_ack',{});if((controllerId||chooseLeader())===clientId)send('state',state())}handleMessage(m.event,m.payload);syncPresence()};bc.postMessage({event:'hello',payload:{},sender:clientId});$('#signal').className='signal';channel=sb.channel(name,{config:{presence:{key:clientId},broadcast:{self:false,ack:true}}});channel.on('presence',{event:'sync'},syncPresence).on('broadcast',{event:'state'},({payload})=>handleMessage('state',payload)).on('broadcast',{event:'request_state'},({payload})=>handleMessage('request_state',payload)).on('broadcast',{event:'state_response'},({payload})=>handleMessage('state_response',payload)).on('broadcast',{event:'reaction'},({payload})=>handleMessage('reaction',payload));channel.subscribe(async status=>{if(status==='SUBSCRIBED'){await channel.track({joinedAt:Date.now()});$('#signal').className='signal';syncPresence()}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){syncPresence()}});const requestId=clientId+Date.now();pendingRequests.set(requestId,performance.now());setTimeout(()=>send('request_state',{requestId}),180);setTimeout(()=>pendingRequests.delete(requestId),2500)}
    function showReaction(emoji,mine=true){const el=document.createElement('span');el.className='burst';el.textContent=emoji;el.style.left=(mine?55:35+Math.random()*30)+'%';el.style.bottom='70px';document.body.appendChild(el);setTimeout(()=>el.remove(),1600);if(!mine)$('#feeling').innerHTML='<b>暮：</b>我收到啦。这个瞬间，想替你收好。'}
    async function copyLink(codeOnly=false){const text=codeOnly?roomId:location.href;try{await navigator.clipboard.writeText(text);toast(codeOnly?'房间码已复制':'房间链接已复制')}catch{prompt('复制下面的内容',text)}}
    $('#createBtn').onclick=()=>goRoom(makeRoom());$('#joinBtn').onclick=()=>goRoom($('#roomInput').value);$('#roomInput').onkeydown=e=>{if(e.key==='Enter')goRoom(e.target.value)};$('#backBtn').onclick=()=>roomId?location.href='index.html':history.back();
    $('#playBtn').onclick=async()=>{if(audio.paused){try{await audio.play()}catch{toast('音频还在准备，请再点一次');return}await localControl('play')}else{audio.pause();await localControl('pause')}updatePlayer()};
    $('#soundGate').onclick=async()=>{try{await audio.play();const catchUp=()=>{const fresh=recalled()||lastKnownState;if(fresh){const t=targetNow(fresh,.1);audio.currentTime=Math.min(t,audio.duration||t)}};catchUp();setTimeout(catchUp,350);$('#soundGate').classList.remove('show');const requestId=clientId+Date.now();pendingRequests.set(requestId,performance.now());await send('request_state',{requestId});updatePlayer()}catch{toast('声音暂时无法播放')}};
    $('#progress').addEventListener('pointerdown',()=>dragging=true);$('#progress').addEventListener('input',e=>{$('#currentTime').textContent=format(Number(e.target.value));e.target.style.setProperty('--fill',(Number(e.target.value)/(audio.duration||276)*100)+'%')});$('#progress').addEventListener('change',async e=>{audio.currentTime=Number(e.target.value);dragging=false;await localControl('seek',audio.currentTime);updatePlayer()});
    $('#volume').oninput=e=>audio.volume=Number(e.target.value);$('#shareBtn').onclick=()=>copyLink(false);$('#copyCode').onclick=()=>copyLink(true);$('.reactions').onclick=e=>{const b=e.target.closest('.reaction');if(!b)return;showReaction(b.textContent);send('reaction',{emoji:b.textContent});$('#feeling').innerHTML='<b>暮：</b>嗯，我也正在听这一小段。'};
    audio.addEventListener('loadedmetadata',()=>{updatePlayer();if(lastKnownState)applyState(lastKnownState,.09)});audio.addEventListener('timeupdate',updatePlayer);audio.addEventListener('play',()=>{if(!applying)updatePlayer()});audio.addEventListener('pause',()=>{if(!applying)updatePlayer()});audio.volume=.75;
